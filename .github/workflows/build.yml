# OKTOWAVE firmware for the M-VAVE FM-1: built on GitHub's Linux runners (the JieLi pi32v2 toolchain is Linux
# x86-64 only), the host tests, the browser emulator (Emscripten) and the site (installer + try + manual).
#   push / pull request: build + tests; artifacts: the package (.fwsc), the test output, the site
#   push to main or a tag: the site is also deployed to GitHub Pages
#   workflow_dispatch: the same, with `update_baselines` to rewrite tests/golden.txt and target_budget.txt (uploaded
#     as an artifact to commit by hand; cpu_baseline.txt is only written on macOS: regress.c has no instruction
#     counter elsewhere) and `release` for a release-identity build
#   a tag vX.Y: a release build (identity FM-1_9XY, oktowave-X.Y.fwsc, a version string "OKTOWAVE vX.Y"), a GitHub
#     release with the package, the app image, SHA256SUMS and the licences, and the site
name: build
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "rewrite the golden / target baselines (GOLDEN_UPDATE=1 BUDGET_UPDATE=1)"
        type: boolean
        default: false
      release:
        description: "release version X.Y (empty: a dev build)"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash          # bash -e -o pipefail: a failing test behind `| tee` fails the step
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Python packages (the fonts and icons are rasterised at build time)"
        run: pip install Pillow fonttools
      - name: "JieLi pi32v2 toolchain (clang 4.0.1, from JieLi's package server)"
        run: |
          sh tools/get_toolchain.sh "$HOME/.jieli"
          ls "$HOME/.jieli/toolchain/pi32v2/bin" | head -5
      - name: "JieLi AC79 SDK files (Apache-2.0: uboot.boot, cfg_tool.bin, eq_cfg_hw.bin; SHA-256 checked by build.py)"
        run: |
          for try in 1 2 3 4; do
            rm -rf "$HOME/fw-AC79_AIoT_SDK"
            if git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 --filter=blob:none --sparse \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"; then break; fi
            echo "clone failed (try $try), waiting"
            [ "$try" = 4 ] && exit 1
            sleep $((try * 20))
          done
          cd "$HOME/fw-AC79_AIoT_SDK" && git sparse-checkout set cpu/wl82/tools && ls cpu/wl82/tools | head
      - name: Version
        id: ver
        env:
          REL_INPUT: ${{ github.event.inputs.release }}
          REF: ${{ github.ref }}
        run: |
          REL="$REL_INPUT"
          case "$REF" in refs/tags/v*) REL="${REF#refs/tags/v}";; esac
          if [ -n "$REL" ] && ! printf '%s' "$REL" | grep -Eq '^[0-9]\.[0-9](\.[0-9]){0,2}(-[A-Za-z0-9]+)?$'; then
            echo "release '$REL' is not X.Y, X.Y.Z, X.Y.Z.W or X.Y-suffix (one digit each)"; exit 1
          fi
          echo "release=$REL" >> "$GITHUB_OUTPUT"
          echo "release: '$REL'"
      - name: Build the firmware
        env:
          REL: ${{ steps.ver.outputs.release }}
        run: |
          export JIELI_TOOLCHAIN="$HOME/.jieli/toolchain" AC79_SDK="$HOME/fw-AC79_AIoT_SDK"
          if [ -n "$REL" ]; then
            python3 tools/build.py --release "$REL"
          else
            python3 tools/build.py
          fi
          ls -la build/*.fwsc build/*.bin
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
      - name: Host tests (tests/run_tests.sh)
        env:
          UPDATE: ${{ github.event.inputs.update_baselines }}
        run: |
          export AC79_SDK="$HOME/fw-AC79_AIoT_SDK"
          if [ "$UPDATE" = "true" ]; then
            GOLDEN_UPDATE=1 BUDGET_UPDATE=1 sh tests/run_tests.sh 2>&1 | tee build/tests.log
          else
            sh tests/run_tests.sh 2>&1 | tee build/tests.log
          fi
      - name: "UI render reports (the layout lint's findings)"
        if: always()
        run: |
          for r in build/ui_new/report.txt build/ui_fm4/report.txt; do
            echo "=== $r"; [ -f "$r" ] && head -150 "$r" | cut -c1-200
          done
          true
      - name: "WAVELET engine: the standalone host test and the floating-point reference"
        if: always()
        run: |
          mkdir -p build/host
          python3 firmware/engines/tools/gen_engine_tables.py build/host/fe_tables.h
          cc -O2 -std=gnu99 -Wall -Wextra -Wno-unused-function -Wno-unused-parameter -Wno-dangling-else -I build/host \
             -o build/host/wavelet_test tests/wavelet_test.c
          build/host/wavelet_test build/host | tee build/wavelet_test.log
          node tools/wavelet_ref.js build/host | tee -a build/wavelet_test.log
      - name: Browser emulator (web/emu)
        run: sh web/emu/build.sh
      - name: Site (installer + try it in the browser + manual)
        env:
          REL: ${{ steps.ver.outputs.release }}
        run: |
          PKG=$(ls build/*.fwsc | head -1)
          VER="$REL"; [ -n "$VER" ] || VER="dev-$(git rev-parse --short HEAD)"
          python3 web/make_site.py "$PKG" "$VER" build/site
          mkdir -p build/site/webapp/try build/site/manual
          cp -r build/emu/. build/site/webapp/try/
          cp docs/manual.html build/site/manual/index.html
          cp docs/controls.jpg build/site/manual/
          ls -R build/site | head -40
      - name: Baselines (to commit by hand after an update run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baselines
          path: |
            tests/golden.txt
            tests/cpu_baseline.txt
            tests/target_budget.txt
            tests/union_golden.txt
            build/tests.log
            build/wavelet_test.log
          if-no-files-found: ignore
      - name: Package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/*.fwsc
            build/felucca.bin
            build/release-*/
          if-no-files-found: ignore
      - name: Site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
  pages:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware
      - name: "GitHub release (a pre-release while the version is 0.x, not yet run on an FM-1)"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          DIR=$(ls -d firmware/release-*/ | head -1)
          [ -d "$DIR" ] || { echo "no release folder in the firmware artifact"; exit 1; }
          PRE=""; case "$TAG" in v0.*) PRE="--prerelease";; esac
          gh release create "$TAG" $PRE --repo "$GITHUB_REPOSITORY" --title "OKTOWAVE ${TAG#v}" \
            --notes "OKTOWAVE ${TAG#v}: Felucca plus the WAVELET engine for the M-VAVE FM-1. Install with the web installer (https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/) or tools/fm1_install.py. Not yet run on a real FM-1: install at your own risk, keep the way back to the official firmware. SHA-256 sums are in SHA256SUMS." \
            "$DIR"/*.fwsc "$DIR"/*.bin "$DIR"/SHA256SUMS "$DIR"/LICENSE "$DIR"/LICENSING.md
