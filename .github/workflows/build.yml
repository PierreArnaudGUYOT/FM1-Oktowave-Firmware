# OKTOWAVE firmware for the M-VAVE FM-1: built on GitHub's Linux runners (the JieLi pi32v2 toolchain is Linux
# x86-64 only), the host tests, the browser emulator (Emscripten) and the site (installer + try + manual).
#   push / pull request: build + tests; artifacts: the package (.fwsc), the test output, the site
#   push to main or a tag: the site is also deployed to GitHub Pages
#   workflow_dispatch: the same, with `update_baselines` to rewrite tests/golden.txt and target_budget.txt (uploaded
#     as an artifact to commit by hand; cpu_baseline.txt is only written on macOS: regress.c has no instruction
#     counter elsewhere) and `release` for a release-identity build
#   a tag vX.Y (OKTOWAVE, main), groovebox-vX.Y (OKTOGROOVE) or duo-vX.Y (OKTODUO), each on its edition's branch: a release build
#     (identity FM-1_9XY, <edition>-X.Y.fwsc, a version string "<EDITION> vX.Y"), a GitHub release with the package, the app image,
#     SHA256SUMS and the licences, and the site
name: build
on:
  push:
    branches: ["**"]
    tags: ["v*", "*-v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "rewrite the golden / target baselines (GOLDEN_UPDATE=1 BUDGET_UPDATE=1)"
        type: boolean
        default: false
      release:
        description: "release version X.Y (empty: a dev build)"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash          # bash -e -o pipefail: a failing test behind `| tee` fails the step
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read      # main's site includes the other editions' (their branches' latest successful run's artifact)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Python packages (the fonts and icons are rasterised at build time)"
        run: pip install Pillow fonttools
      - name: "JieLi pi32v2 toolchain (clang 4.0.1, from JieLi's package server)"
        run: |
          sh tools/get_toolchain.sh "$HOME/.jieli"
          ls "$HOME/.jieli/toolchain/pi32v2/bin" | head -5
      - name: "JieLi AC79 SDK files (Apache-2.0: uboot.boot, cfg_tool.bin, eq_cfg_hw.bin; SHA-256 checked by build.py)"
        run: |
          for try in 1 2 3 4; do
            rm -rf "$HOME/fw-AC79_AIoT_SDK"
            if git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 --filter=blob:none --sparse \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"; then break; fi
            echo "clone failed (try $try), waiting"
            [ "$try" = 4 ] && exit 1
            sleep $((try * 20))
          done
          cd "$HOME/fw-AC79_AIoT_SDK" && git sparse-checkout set cpu/wl82/tools && ls cpu/wl82/tools | head
      - name: Version
        id: ver
        env:
          REL_INPUT: ${{ github.event.inputs.release }}
          REF: ${{ github.ref }}
        run: |
          REL="$REL_INPUT"
          case "$REF" in refs/tags/v*) REL="${REF#refs/tags/v}";; refs/tags/*-v*) REL="${REF##*-v}";; esac
          if [ -n "$REL" ] && ! printf '%s' "$REL" | grep -Eq '^[0-9]\.[0-9](\.[0-9]){0,2}(-[A-Za-z0-9]+)?$'; then
            echo "release '$REL' is not X.Y, X.Y.Z, X.Y.Z.W or X.Y-suffix (one digit each)"; exit 1
          fi
          ED=OKTOWAVE                                   # the edition this tree builds: a define in felucca.c (tools/build.py reads the same)
          if grep -q '^#define OKTOWAVE_DUO\b' firmware/src/felucca.c; then ED=OKTODUO
          elif grep -q '^#define OKTOWAVE_GROOVEBOX\b' firmware/src/felucca.c; then ED=OKTOGROOVE; fi
          echo "release=$REL" >> "$GITHUB_OUTPUT"
          echo "edition=$ED" >> "$GITHUB_OUTPUT"
          echo "release: '$REL', edition: $ED"
      - name: Build the firmware
        env:
          REL: ${{ steps.ver.outputs.release }}
        run: |
          export JIELI_TOOLCHAIN="$HOME/.jieli/toolchain" AC79_SDK="$HOME/fw-AC79_AIoT_SDK"
          if [ -n "$REL" ]; then
            python3 tools/build.py --release "$REL"
          else
            python3 tools/build.py
          fi
          ls -la build/*.fwsc build/*.bin
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
      - name: Host tests (tests/run_tests.sh)
        env:
          UPDATE: ${{ github.event.inputs.update_baselines }}
        run: |
          export AC79_SDK="$HOME/fw-AC79_AIoT_SDK"
          if [ "$UPDATE" = "true" ]; then
            GOLDEN_UPDATE=1 BUDGET_UPDATE=1 sh tests/run_tests.sh 2>&1 | tee build/tests.log
          else
            sh tests/run_tests.sh 2>&1 | tee build/tests.log
          fi
      - name: "UI render reports (the layout lint's findings)"
        if: always()
        run: |
          for r in build/ui_new/report.txt build/ui_fm4/report.txt; do
            echo "=== $r"; [ -f "$r" ] && head -150 "$r" | cut -c1-200
          done
          true
      - name: "WAVELET engine: the standalone host test and the floating-point reference"
        if: always()
        run: |
          mkdir -p build/host
          python3 tools/gen_tables.py build/host/felucca_tables.h
          cc -O2 -std=gnu99 -Wall -Wextra -Wno-unused-function -Wno-unused-parameter -Wno-dangling-else -I build/host \
             -o build/host/wavelet_test tests/wavelet_test.c -lm
          build/host/wavelet_test build/host | tee build/wavelet_test.log
          node tools/wavelet_ref.js build/host | tee -a build/wavelet_test.log
      - name: "The editions' engine list tests (OKTOGROOVE, OKTODUO: only the tests that exist on this branch)"
        if: always()
        run: |
          for ED in groovebox duo; do
            if [ -f "tests/${ED}_test.c" ]; then
              DEF=$(echo "$ED" | tr a-z A-Z)
              cc -w "-DOKTOWAVE_${DEF}=1" -DOKTOWAVE_BOOT=1 -Ibuild/gen -Ifirmware/src -o "build/host/${ED}_test" "tests/${ED}_test.c" -lm
              "build/host/${ED}_test" | tee "build/${ED}_test.log"
            fi
          done
      - name: "The shared voice budget with WAVELET's weight (tests/budget_test.c)"
        if: always()
        run: |
          cc -w -Ibuild/gen -Ifirmware/src -o build/host/budget_test tests/budget_test.c -lm
          build/host/budget_test | tee build/budget_test.log
      - name: Browser emulator (web/emu)
        run: sh web/emu/build.sh
      - name: Site (installer + try it in the browser + manual)
        env:
          REL: ${{ steps.ver.outputs.release }}
          ED: ${{ steps.ver.outputs.edition }}
        run: |
          PKG=$(ls build/*.fwsc | head -1)
          VER="$REL"; [ -n "$VER" ] || VER="dev-$(git rev-parse --short HEAD)"
          EDITION="$ED" python3 web/make_site.py "$PKG" "$VER" build/site
          mkdir -p build/site/webapp/try build/site/manual
          cp -r build/emu/. build/site/webapp/try/
          cp docs/manual.html build/site/manual/index.html
          cp docs/controls.jpg build/site/manual/
          ls -R build/site | head -40
      - name: "Keep this branch's site (the main site shows the other editions' under /groovebox/ and /duo/)"
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.ref_name }}
          path: build/site
          retention-days: 90
      - name: "Add the other editions' sites (main only: the latest successful run of each edition's branch)"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LINKS=""
          for E in wavelet-groovebox:groovebox:OKTOGROOVE oktoduo:duo:OKTODUO; do
            BR=${E%%:*}; REST=${E#*:}; DIR=${REST%%:*}; NAME=${REST#*:}
            ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch "$BR" --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
            if [ -n "$ID" ] && gh run download "$ID" --repo "$GITHUB_REPOSITORY" -n "site-$BR" -D "build/site/$DIR"; then
              LINKS="$LINKS · <a href=\"$DIR/\">$NAME edition</a>"
              echo "$NAME site from run $ID"
            else
              echo "no $NAME site yet"
            fi
          done
          if [ -n "$LINKS" ]; then
            sed -i "s#<a href=\"manual/\">manual</a>#<a href=\"manual/\">manual</a>$LINKS#" build/site/index.html
          fi
      - name: Baselines (to commit by hand after an update run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baselines
          path: |
            tests/golden.txt
            tests/cpu_baseline.txt
            tests/target_budget.txt
            tests/union_golden.txt
            build/tests.log
            build/wavelet_test.log
          if-no-files-found: ignore
      - name: Package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/*.fwsc
            build/felucca.bin
            build/release-*/
          if-no-files-found: ignore
      - name: Site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
  pages:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware
      - name: "GitHub release (a pre-release while the version is 0.x, not yet run on an FM-1)"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          DIR=$(ls -d firmware/release-*/ | head -1)
          [ -d "$DIR" ] || { echo "no release folder in the firmware artifact"; exit 1; }
          PRE=""; case "$TAG" in v0.*|*-v0.*) PRE="--prerelease";; esac
          PK=$(ls "$DIR"/*.fwsc | head -1); NAME=$(basename "$PK" .fwsc)            # e.g. oktoduo-0.1
          ED=$(echo "${NAME%%-*}" | tr a-z A-Z); VER="${NAME#*-}"
          gh release create "$TAG" $PRE --repo "$GITHUB_REPOSITORY" --title "$ED $VER" \
            --notes "$ED $VER: a firmware for the M-VAVE FM-1 built on Felucca, with the Wavelet Synthesizer's WAVELET engine. Install with the web installer (https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/, the edition's page) or tools/fm1_install.py. Not yet run on a real FM-1: install at your own risk, keep the way back to the official firmware. SHA-256 sums are in SHA256SUMS." \
            "$DIR"/*.fwsc "$DIR"/*.bin "$DIR"/SHA256SUMS "$DIR"/LICENSE "$DIR"/LICENSING.md
  refresh-main:
    needs: build
    if: github.ref == 'refs/heads/wavelet-groovebox' || github.ref == 'refs/heads/oktoduo'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: "Rebuild main so that its site shows this edition (/groovebox/, /duo/)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main
